services:
  db:
    image: mariadb:11.4
    container_name: urlsDb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    networks:
      urlsNetwork:
    ports:
        - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    
networks:
  urlsNetwork:
     driver: bridge
     
volumes:
  mariadb_data: