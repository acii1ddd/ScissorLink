<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScissorLink</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row mb-4">
        <div class="col">
            <h1 class="display-4">
                <i class="bi bi-scissors text-primary"></i> ScissorLink
            </h1>
            <p class="lead">Сокращайте длинные ссылки быстро и бесплатно</p>
        </div>
    </div>

    <div class="row mb-5">
        <div class="col-md-8 mx-auto">
            <div class="card shadow">
                <div class="card-body">
                    <div class="input-group">
                        <label for="longUrl"></label>
                        <input type="url" class="form-control form-control-lg" id="longUrl" placeholder="https://example.com/very-long-url...">
                        <button class="btn btn-primary btn-lg" id="shortenBtn">
                            <i class="bi bi-scissors"></i> Сократить
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow">
        <div class="card-header bg-white">
            <h5 class="mb-0">Ваши ссылки</h5>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                    <tr>
                        <th>Длинный URL</th>
                        <th>Короткий URL</th>
                        <th>Дата</th>
                        <th>Переходы</th>
                        <th>Действия</th>
                    </tr>
                    </thead>
                    <tbody id="urlsBody">
                    <tr>
                        <td colspan="5" class="text-center py-4 text-muted">
                            <i class="bi bi-arrow-repeat spin me-2"></i>Загрузка...
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Модальное окно редактирования -->
<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Редактировать ссылку</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editId">
                <label for="editLongUrl"></label><input type="url" class="form-control" id="editLongUrl">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                <button type="button" class="btn btn-primary" onclick="saveEdit()">Сохранить</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API_BASE = 'http://localhost:7373/api';
    let editModal;

    document.addEventListener('DOMContentLoaded', () => {
        editModal = new bootstrap.Modal(document.getElementById('editModal'));
        loadUrls();
    });

    document.getElementById('shortenBtn').addEventListener('click', createUrl);

    async function createUrl() {
        const longUrl = document.getElementById('longUrl').value;
        if (!longUrl) return alert('Введите URL');

        try {
            document.getElementById('shortenBtn').disabled = true;

            const response = await fetch(`${API_BASE}/urls`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ longUrl })
            });

            if (!response.ok) throw new Error('Ошибка создания');

            document.getElementById('longUrl').value = '';
            await loadUrls();
            showToast('Ссылка создана!', 'success');
        } catch (error) {
            showToast('Ошибка: ' + error.message, 'danger');
        } finally {
            document.getElementById('shortenBtn').disabled = false;
        }
    }

    async function loadUrls() {
        try {
            const response = await fetch(`${API_BASE}/urls`);
            const urls = await response.json();

            const tbody = document.getElementById('urlsBody');
            tbody.innerHTML = '';

            urls.forEach(url => {
                const row = document.createElement('tr');
                row.innerHTML = `
                        <td title="${url.longUrl}">${truncate(url.longUrl, 50)}</td>
                        <td>
                            <a href="/go/${url.shortUrl}" target="_blank" class="text-decoration-none">
                                ${url.shortUrl} <i class="bi bi-box-arrow-up-right small"></i>
                            </a>
                        </td>
                        <td>${url.createdAt}</td>
                        <td><span class="badge bg-info">${url.clickCount}</span></td>
                        <td>
                            <button class="btn btn-sm btn-warning" onclick="editUrl('${url.id}', '${url.longUrl}')">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="deleteUrl('${url.id}')">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    `;
                tbody.appendChild(row);
            });
        } catch (error) {
            showToast('Ошибка загрузки: ' + error.message, 'danger');
        }
    }

    let refreshInterval;

    document.addEventListener('DOMContentLoaded', () => {
        editModal = new bootstrap.Modal(document.getElementById('editModal'));
        loadUrls();

        refreshInterval = setInterval(loadUrls, 5000);
    });

    window.addEventListener('beforeunload', () => {
        if (refreshInterval) {
            clearInterval(refreshInterval);
        }
    });
    
    function truncate(str, n) {
        return str.length > n ? str.substr(0, n) + '...' : str;
    }

    function editUrl(id, longUrl) {
        document.getElementById('editId').value = id;
        document.getElementById('editLongUrl').value = longUrl;
        editModal.show();
    }

    async function saveEdit() {
        const id = document.getElementById('editId').value;
        const longUrl = document.getElementById('editLongUrl').value;

        try {
            const response = await fetch(`${API_BASE}/urls/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ longUrl })
            });

            if (!response.ok) throw new Error('Ошибка обновления');

            editModal.hide();
            await loadUrls();
            showToast('Ссылка обновлена!', 'success');
        } catch (error) {
            showToast('Ошибка: ' + error.message, 'danger');
        }
    }

    async function deleteUrl(id) {
        if (!confirm('Удалить ссылку?')) return;

        try {
            const response = await fetch(`${API_BASE}/urls/${id}`, {
                method: 'DELETE'
            });

            if (!response.ok) throw new Error('Ошибка удаления');

            await loadUrls();
            showToast('Ссылка удалена!', 'success');
        } catch (error) {
            showToast('Ошибка: ' + error.message, 'danger');
        }
    }

    function showToast(message, type = 'success') {
        const toast = document.createElement('div');
        toast.className = `position-fixed bottom-0 end-0 m-3 alert alert-${type} alert-dismissible fade show`;
        toast.role = 'alert';
        toast.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }
</script>
</body>
</html>
